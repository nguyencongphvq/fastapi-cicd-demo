# ============================================================
# Pipeline CI/CD hoàn chỉnh: Test -> Build & Push image
# ============================================================
name: CI/CD Pipeline

on:
  push:
    branches: [ Main ]
  pull_request:
    branches: [ Main ]

# Biến dùng chung cho toàn workflow
env:
  REGISTRY: ghcr.io # GitHub Container Registry
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ================= JOB 1: TEST (CI) =================
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run tests
        run: pytest -v

  # ============ JOB 2: BUILD & PUSH IMAGE (CD) ============
  build-and-push:
    runs-on: ubuntu-latest
    needs: test # CHỈ chạy khi job test đã PASS
    
    # Chỉ build khi push lên main (không build cho PR):
    if: github.event_name == 'push' && github.ref == 'refs/heads/Main'
    
    # Cấp quyền cho GITHUB_TOKEN (token tự sinh cho mỗi lần chạy):
    permissions:
      contents: read # đọc code
      packages: write # ghi (push) image lên GHCR
      
    steps:
      - uses: actions/checkout@v4
      
      # Đăng nhập GHCR
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      # Sinh tag/label chuẩn cho image (latest + mã commit)
      - name: Extract metadata (tags, labels)
        id: meta # đặt id để step sau tham chiếu
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha
            
      # Build image từ Dockerfile và push lên GHCR trong 1 bước
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}